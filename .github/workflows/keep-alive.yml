name: Supabase Keep-Alive

# Menține proiectul Supabase (plan Free) activ — previne pauza automată
# după 7 zile de inactivitate. Face un request zilnic către API-ul REST.

on:
  schedule:
    # Zilnic la 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Lipsesc secrets: SUPABASE_URL / SUPABASE_ANON_KEY. Adaugă-le în Settings → Secrets and variables → Actions."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -f "${SUPABASE_URL}/rest/v1/documents?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase REST API responded with HTTP $status"
